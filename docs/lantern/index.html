<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lantern</title>
<link rel="stylesheet" href="../site.css">
<style>
  .door { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 16px; }
  .door form { width: min(32em, 100%); transition: opacity 1.2s ease; }
  .door .prompt { display: flex; align-items: baseline; gap: 1ch; }
  .door label { white-space: nowrap; }
  .door input {
    flex: 1; min-width: 0; background: transparent; border: 0; color: var(--fg);
    font: inherit; padding: 0; border-radius: 0; outline: none; caret-color: var(--fg);
  }
  .status { min-height: 1.7em; margin-top: .9em; font: inherit; color: var(--muted); opacity: 0; transition: opacity .6s; }
  .status.on { opacity: 1; }

  .reveal { max-width: 68ch; margin: 0 auto; padding: 14vh 16px 18vh; }
  .reveal[hidden] { display: none; }
  .log-title { font: inherit; color: var(--muted); margin: 0 0 .8em; }
  .log {
    font: .92em/1.75 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere;
    margin: 0 0 3em; padding: 0 0 0 1em; border-left: 1px solid var(--faint); min-height: 3.5em;
  }
  .log .ua { background: color-mix(in srgb, var(--fg) 9%, transparent); transition: background 2s; }
  .caret { display: inline-block; width: .55em; height: 1.05em; vertical-align: -.15em; background: var(--fg); animation: blink 1.05s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .reveal p, .reveal dl, .reveal .bang, .reveal .colophon, .reveal .again { opacity: 0; transform: translateY(6px); transition: opacity 1.6s ease, transform 1.6s ease; }
  .reveal .shown { opacity: 1; transform: none; }
  .bang { font-size: 1.5em; margin: 1.4em 0 1.4em; line-height: 1.3; }
  dl { margin: 0 0 2.6em; display: grid; grid-template-columns: max-content 1fr; gap: .35em 1.4em; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  dd code, .colophon { font: inherit; }
  .trail { list-style: none; padding: 0; margin: 0; }
  .trail span { color: var(--muted); }
  .sign { }
  .colophon { color: var(--muted); margin: 4em 0 1.2em; line-height: 1.9; }
  .again { font-size: .85em; }
  @media (max-width: 520px) { dl { grid-template-columns: 1fr; gap: 0; } dd { margin-bottom: .7em; } }
  @media (prefers-reduced-motion: reduce) {
    .caret { animation: none; }
    .reveal p, .reveal dl, .reveal .bang, .reveal .colophon, .reveal .again, .door form { transition: none; }
  }
</style>
</head>
<body>
<!--
  the lantern doesn't keep secrets from the people it lets in.
  it gave you something when you arrived. look where you're standing.
-->
<div class="door" id="door">
  <form id="f" autocomplete="off">
    <div class="prompt"><label for="who">who are you?</label><input id="who" spellcheck="false" autocapitalize="off" autocorrect="off" autofocus></div>
    <div class="status" id="status" aria-live="polite">403</div>
  </form>
</div>
<article class="reveal" id="reveal" hidden></article>
<script src="../trace.js"></script>
<script src="sealed.js"></script>
<script src="lantern.js"></script>
</body>
</html>
